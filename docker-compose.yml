name: hydropacifique

services:
  web:
    build:
      context: .
      args:
        PHP_VERSION: "8.2"
    image: hydropacifique-web:latest
    restart: unless-stopped
    ports:
      # Bind to loopback only when a reverse proxy (nginx/Traefik) terminates TLS
      # in front: WEB_BIND=127.0.0.1 in .env. Default is all interfaces.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # No env_file here on purpose: it would inject every .env value (including
    # MYSQL_ROOT_PASSWORD) into the web container. Compose already interpolates
    # ${...} from .env, so listing only what the app needs is enough.
    environment:
      DB_SERVER: db
      DB_SERVER_USERNAME: ${MYSQL_USER:?set MYSQL_USER in .env}
      DB_SERVER_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_DATABASE: ${MYSQL_DATABASE:-hp-data-fj}
      # Must be the public URL of the deployment — the app builds absolute links
      # and redirects from it. Leaving it as localhost breaks logins behind a proxy.
      HP_HTTP_SERVER: ${HP_HTTP_SERVER:?set HP_HTTP_SERVER in .env}
      HP_HTTPS_SERVER: ${HP_HTTPS_SERVER:?set HP_HTTPS_SERVER in .env}
      # Note: INIT_T and the other HP_* labels stay hard-coded in
      # config_plateform.docker.php — config.php interpolates INIT_T into SQL
      # unescaped, so it must not be settable from the environment.
    volumes:
      # Container-specific DB/URL config, mounted over the gitignored local one.
      - ./include/config_plateform.docker.php:/var/www/html/include/config_plateform.php:ro
      # Uploads and generated exports must outlive the container.
      # On the server: sudo chown -R 33:33 ./data   (33 = www-data)
      - ./data:/var/www/html/data
      # Map tiles are static assets and are excluded from the image (7MB+).
      - ./map:/var/www/html/map:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    # The source server is MySQL 9.6 and the schema uses utf8mb4_0900_ai_ci and
    # utf8mb3, neither of which MySQL 5.7 accepts. 8.4 is the current LTS and
    # imports the dump as-is.
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # MySQL 8.4 enables ONLY_FULL_GROUP_BY by default, which this codebase
      # predates: 225 files use SELECT DISTINCT and 35 use GROUP BY in the older,
      # looser style (e.g. filtre_stations_var.php:276 selects four columns with
      # DISTINCT but orders by a fifth). Also dropping NO_ZERO_DATE /
      # NO_ZERO_IN_DATE, because the schema itself declares columns as
      # `date NOT NULL DEFAULT '0000-00-00'`.
      #
      # STRICT_TRANS_TABLES is kept deliberately: it turns over-long or bad
      # values into errors instead of silently truncating measurement data. If
      # that starts blocking legitimate writes ("Data too long", "Incorrect date
      # value"), reduce this to just NO_ENGINE_SUBSTITUTION.
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hp-data-fj}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      # Runs ONLY on first boot against an empty db_data volume. Schema only —
      # this file contains no INSERTs. To seed real records instead, point this
      # at a dump from db_backup/.
      - ./20260814-HP-DB-Structure.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # No ports: mapping — the database is reachable only on the compose network.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
