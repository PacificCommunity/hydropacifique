; HydroPacifique production overrides (layered on top of php.ini-production).

; --- Error handling -----------------------------------------------------------
; Never render errors to the browser; the app also sets display_errors=0 itself
; in ~21 places, but that does not cover startup or parse errors.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; Legacy 8.0-era code emits many deprecations on newer runtimes; keep them out of
; the log noise but leave warnings and errors visible.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off

; --- Limits -------------------------------------------------------------------
; Station photos (process_newphoto.php) and data imports (load_file.php) upload
; files; the 2M/8M defaults are too small for import batches.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50
; PDF (mpdf) and spreadsheet (phpspreadsheet) generation over long series is slow.
max_execution_time = 300
max_input_time = 300
; The app raises this to 2048M itself for the heaviest jobs; this is the floor.
memory_limit = 512M

; --- Time zone ----------------------------------------------------------------
; Fallback only: the app calls date_default_timezone_set() per request from the
; platform/user setting, so keep the default neutral.
date.timezone = UTC

; --- Sessions -----------------------------------------------------------------
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

; --- OPcache ------------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is baked into the image, so timestamp checks could be disabled entirely
; (opcache.validate_timestamps=0) for a little more speed — that requires a
; container restart on every deploy, which is why it is left on here.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
