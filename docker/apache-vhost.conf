# Silences "could not reliably determine the server's fully qualified domain name".
ServerName localhost

# Behind a reverse proxy the real host/scheme arrive in headers; the app builds
# absolute URLs from HTTP_SERVER instead, so nothing else is needed here.
<VirtualHost *:8080>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defence in depth: dumps, backups and logs must never be downloadable even
    # if one is copied into the tree by mistake. (.dockerignore already keeps
    # *.sql and db_backup/ out of the image.)
    <FilesMatch "\.(sql|sql\.gz|dump|log|bak|old|orig|ini|lock|md|docx)$">
        Require all denied
    </FilesMatch>

    # Credentials live in include/config_plateform.php. It is PHP so it would not
    # leak as source, but there is no reason to serve anything here directly.
    <FilesMatch "^config_plateform.*\.php$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/var/www/html/(\.git|db_backup)">
        Require all denied
    </DirectoryMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
